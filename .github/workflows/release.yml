name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Terminal binaries for every platform. The daemon now builds on Windows too:
  # process handling lives in process_unix.go / process_windows.go.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go test ./...

      - name: build archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="gh-issue-killer_${version}_${os}_${arch}"
            binary="gh-issue-killer"
            mkdir -p "dist/${name}"
            if [ "$os" = "windows" ]; then
              binary="gh-issue-killer.exe"
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" \
              -o "dist/${name}/${binary}" ./cmd/gh-issue-killer
            cp README.md README.zh-CN.md LICENSE DEPLOY.md "dist/${name}/"
            if [ "$os" = "windows" ]; then
              (cd "dist/${name}" && zip -qr "../${name}.zip" .)
            else
              tar -C "dist/${name}" -czf "dist/${name}.tar.gz" .
            fi
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # Desktop shell per platform. The shell is a thin Wails 3 window around the
  # engine, so each bundle ships both binaries; see desktop/build/package.sh.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 was retired on 2026-11-02; macos-15 is the arm64 image.
          - runner: macos-15 # arm64
            os: darwin
          - runner: macos-15-intel # amd64
            os: darwin
          # Wails v3 links GTK4 + webkitgtk-6.0, which Ubuntu 22.04 does not
          # package; 24.04 has both.
          - runner: ubuntu-24.04
            os: linux
          - runner: windows-latest
            os: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install webkitgtk
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: build bundle (macOS/Linux)
        if: matrix.os != 'windows'
        run: desktop/build/package.sh "${GITHUB_REF_NAME}"

      - name: build bundle (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./desktop/build/package.ps1 -Version $env:GITHUB_REF_NAME

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runner }}
          path: |
            desktop/build/dist/*.zip
            desktop/build/dist/*.tar.gz
            desktop/build/dist/*.dmg
          if-no-files-found: error

  publish:
    needs: [binaries, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip *.dmg > checksums.txt
          cat checksums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
