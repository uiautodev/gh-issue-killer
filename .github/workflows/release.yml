name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go test ./...

      - name: build archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          # The daemon is POSIX-only (process groups via syscall), so no Windows.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="gh-issue-killer_${version}_${os}_${arch}"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${name}/gh-issue-killer" ./cmd/gh-issue-killer
            cp README.md README.zh-CN.md LICENSE DEPLOY.md "dist/${name}/"
            tar -C "dist/${name}" -czf "dist/${name}.tar.gz" .
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          ls -lh dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
