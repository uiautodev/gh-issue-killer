name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend install
        run: npm ci
        working-directory: frontend
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - name: frontend check
        run: npm run check
        working-directory: frontend
      - name: frontend test
        run: npm test
        working-directory: frontend
      - name: frontend build
        run: npm run build
        working-directory: frontend
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
