# Local hooks only: no third-party repositories, just the Go toolchain.
# Install with: pre-commit install
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'files=$(gofmt -l "$@"); if [ -n "$files" ]; then echo "run gofmt -w on:"; echo "$files"; exit 1; fi' --
        language: system
        files: '\.go$'
        pass_filenames: true
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        pass_filenames: false
      - id: check-large-files
        name: check large files
        # Anything above 1 MB should go through Git LFS or a release asset.
        entry: bash -c 'limit=1048576; fail=0; for f in "$@"; do [ -f "$f" ] || continue; size=$(wc -c < "$f"); if [ "$size" -gt "$limit" ]; then echo "$f is ${size} bytes (limit 1 MB)"; fail=1; fi; done; exit $fail' --
        language: system
        pass_filenames: true
