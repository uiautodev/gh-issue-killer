<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gh-issue-killer · 调度台</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem("ghik-theme") || "auto"; } catch (_) { document.documentElement.dataset.theme = "auto"; }
</script>
<style>
  :root {
    color-scheme: dark;
    --ink: #0c161a;
    --ink-2: #102126;
    --panel: #13272d;
    --rule: #24434c;
    --rule-soft: #1b333a;
    --text: #ece7d8;
    --muted: #87a2a7;
    --dim: #5f797e;
    --work: #f0a53f;
    --wait: #5fb6c8;
    --blocked: #e0604e;
    --done: #6fb08d;
    --idle: #5d7377;
    --focus: #f4c877;
    --log-info: #7fd6e8;
    --log-warn: #f0a53f;
    --log-error: #ef8274;
    --log-debug: #93a6a9;
    --sans: "Barlow Condensed", "Avenir Next Condensed", "Helvetica Neue", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --ink: #eef2ee;
    --ink-2: #e4ebe5;
    --panel: #dde6df;
    --rule: #b6c6bf;
    --rule-soft: #cdd9d2;
    --text: #14262b;
    --muted: #445d63;
    --dim: #566f74;
    --work: #9a5b00;
    --wait: #0d6f83;
    --blocked: #b33527;
    --done: #2f7a58;
    --idle: #6f8a8e;
    --focus: #9a5b00;
    --log-info: #0d6f83;
    --log-warn: #8a5200;
    --log-error: #b33527;
    --log-debug: #5c7276;
  }
  @media (prefers-color-scheme: light) {
    :root[data-theme="auto"] {
      color-scheme: light;
      --ink: #eef2ee;
      --ink-2: #e4ebe5;
      --panel: #dde6df;
      --rule: #b6c6bf;
      --rule-soft: #cdd9d2;
      --text: #14262b;
      --muted: #445d63;
      --dim: #566f74;
      --work: #9a5b00;
      --wait: #0d6f83;
      --blocked: #b33527;
      --done: #2f7a58;
      --idle: #6f8a8e;
      --focus: #9a5b00;
      --log-info: #0d6f83;
      --log-warn: #8a5200;
      --log-error: #b33527;
      --log-debug: #5c7276;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--work); color: var(--ink); }
  a { color: var(--wait); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-appearance: none; appearance: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- header ---------- */
  .masthead {
    border-bottom: 1px solid var(--rule);
    background:
      repeating-linear-gradient(90deg, transparent 0 79px, rgba(95,182,200,.05) 79px 80px),
      var(--ink-2);
    padding: 18px 28px 14px;
  }
  .mast-row { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 38px; height: 38px; display: block; border: 1px solid var(--rule); flex: none; }
  .wordmark {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 40px;
    line-height: 1;
    letter-spacing: .01em;
    margin: 0 0 5px;
  }
  .tagline {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 0;
    max-width: 48ch;
  }
  .status-strip { display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; }
  .toolbar { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .seg { display: flex; border: 1px solid var(--rule); align-self: flex-start; }
  .seg button {
    padding: 3px 9px; font-size: 10.5px; color: var(--muted); border-left: 1px solid var(--rule);
  }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--rule-soft); color: var(--text); }
  .seg button:hover { color: var(--text); }
  .gh-link {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule);
    padding: 3px 10px; color: var(--muted); font-size: 10.5px; white-space: nowrap;
  }
  .gh-link:hover { color: var(--text); background: var(--rule-soft); text-decoration: none; }
  .gh-link svg { width: 13px; height: 13px; fill: currentColor; flex: none; }
  .stat { display: flex; flex-direction: column; gap: 2px; min-width: 74px; }
  .stat b {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 22px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat small { color: var(--dim); font-size: 10px; letter-spacing: .04em; }
  .lamp {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--done); margin-right: 7px; vertical-align: 1px;
    box-shadow: 0 0 0 3px rgba(111,176,141,.12);
  }
  .lamp.stopped { background: var(--blocked); box-shadow: 0 0 0 3px rgba(224,96,78,.12); }
  .lamp.live { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 6px rgba(111,176,141,0); } }
  @media (prefers-reduced-motion: reduce) { .lamp.live { animation: none; } }

  .cell { width: 13px; height: 8px; background: var(--rule-soft); }
  .cell.on { background: var(--work); }
  .meta-line { color: var(--dim); font-size: 10.5px; display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .meta-line b { color: var(--muted); font-weight: 500; }

  /* ---------- lines ---------- */
  .band { padding: 12px 28px; border-bottom: 1px solid var(--rule); }
  .band-title {
    font-family: var(--sans); font-weight: 600; font-size: 12px; letter-spacing: .14em;
    color: var(--muted); margin: 0 0 8px;
  }
  .lines { display: grid; grid-template-columns: repeat(auto-fit, minmax(232px, 1fr)); gap: 1px; background: var(--rule-soft); }
  .line {
    background: var(--ink-2); padding: 9px 12px 10px; display: flex; flex-direction: column; gap: 5px;
    min-width: 0;
  }
  .line-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .line-name {
    font-family: var(--sans); font-weight: 600; font-size: 17px; letter-spacing: .01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .line-agent { color: var(--dim); font-size: 10px; margin-left: auto; white-space: nowrap; }
  .line-foot { display: flex; gap: 12px; color: var(--dim); font-size: 10px; flex-wrap: wrap; }
  .line-pools { display: flex; gap: 16px; flex-wrap: wrap; margin: 1px 0 2px; }
  .mini-meter { display: flex; flex-direction: column; gap: 3px; }
  .mini-head { display: flex; gap: 6px; align-items: baseline; }
  .mini-label { font-family: var(--sans); font-size: 10px; letter-spacing: .1em; color: var(--muted); }
  .mini-num { font-size: 9.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .mini-cells { display: flex; gap: 2px; }
  .mini-cells .cell { width: 8px; height: 5px; }
  .counts { display: flex; gap: 10px; flex-wrap: wrap; }
  .count { color: var(--muted); font-size: 10px; display: inline-flex; align-items: center; gap: 4px; }
  .count b { color: var(--text); font-weight: 500; }
  .swatch { width: 5px; height: 5px; background: var(--idle); display: inline-block; }
  .swatch.working { background: var(--work); }
  .swatch.waiting { background: var(--wait); }
  .swatch.blocked { background: var(--blocked); }
  .swatch.done { background: var(--done); }

  /* ---------- board ---------- */
  .board-wrap { padding: 14px 28px 4px; flex: 1; }
  .board-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .filters { display: flex; gap: 4px; }
  .chip {
    border: 1px solid var(--rule); padding: 3px 9px; font-size: 10.5px; color: var(--muted);
    background: transparent;
  }
  .chip[aria-pressed="true"] { border-color: var(--work); color: var(--work); }
  .chip.hide-chip[aria-pressed="true"] { border-color: var(--wait); color: var(--wait); }
  .repo-filter {
    background: var(--ink-2); border: 1px solid var(--rule); color: var(--text);
    padding: 4px 7px; font: inherit; font-size: 11px; max-width: 240px;
  }
  .search {
    margin-left: auto; background: var(--ink-2); border: 1px solid var(--rule); color: var(--text);
    padding: 4px 9px; font: inherit; font-size: 11px; width: 210px;
  }
  .search::placeholder { color: var(--dim); }

  table.board { width: 100%; border-collapse: collapse; }
  .board thead th {
    text-align: left; font-family: var(--sans); font-weight: 600; font-size: 11px;
    letter-spacing: .12em; color: var(--dim); padding: 6px 10px;
    border-bottom: 1px solid var(--rule);
  }
  .board tbody tr {
    border-bottom: 1px solid var(--rule-soft); cursor: pointer;
  }
  .board tbody tr:hover { background: rgba(95,182,200,.05); }
  .board tbody tr.selected { background: rgba(240,165,63,.07); box-shadow: inset 2px 0 0 var(--work); }
  .board td { padding: 8px 10px; vertical-align: middle; }
  .issue-cell { max-width: 420px; min-width: 240px; }
  .issue-ref { color: var(--dim); font-size: 10px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .issue-title { font-size: 12.5px; color: var(--text); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; }
  .dot.active { background: var(--work); animation: blink 1.6s steps(2, start) infinite; }
  .dot.queued { border: 1px solid var(--wait); }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot.active { animation: none; } }

  .stamp {
    display: inline-block; padding: 2px 7px; border: 1px solid currentColor; font-size: 10px;
    white-space: nowrap;
  }
  .stamp.working { color: var(--work); }
  .stamp.waiting { color: var(--wait); }
  .stamp.blocked { color: var(--blocked); }
  .stamp.done { color: var(--done); }
  .stamp.idle { color: var(--dim); }

  .rail { display: flex; align-items: center; gap: 0; list-style: none; margin: 0; padding: 0; }
  .rail li {
    position: relative; width: 26px; height: 14px; display: flex; align-items: center; justify-content: center;
    color: var(--rule);
  }
  .rail li::before {
    content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 1px; background: var(--rule-soft);
  }
  .rail li:first-child::before { left: 50%; }
  .rail li:last-child::before { right: 50%; }
  .rail li i {
    position: relative; z-index: 1; width: 5px; height: 5px; border-radius: 50%; background: var(--rule-soft);
  }
  .rail li.done i { background: var(--done); }
  .rail li.done::before { background: var(--done); opacity: .5; }
  .rail li.now i { background: var(--work); box-shadow: 0 0 0 2px rgba(240,165,63,.22); }
  .rail li.blocked i { background: var(--blocked); box-shadow: 0 0 0 2px rgba(224,96,78,.22); }
  .rail li.skip i { background: var(--rule-soft); }
  .rail li.skip { opacity: .35; }

  .time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pr { color: var(--wait); white-space: nowrap; }

  .empty {
    padding: 48px 10px; text-align: center; color: var(--dim);
  }
  .empty strong { display: block; color: var(--muted); font-weight: 500; font-size: 13px; margin-bottom: 4px; }

  /* ---------- console ---------- */
  .console {
    border-top: 1px solid var(--rule); background: var(--ink-2); padding: 10px 28px 14px;
  }
  .console-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .console-head .band-title { margin: 0; }
  .console-head .spacer { flex: 1; }
  .toggle {
    border: 1px solid var(--rule); padding: 2px 9px; font-size: 10.5px; color: var(--muted);
  }
  .toggle:hover { color: var(--text); }
  pre.log {
    margin: 0; max-height: 210px; overflow: auto; font-size: 10.5px; line-height: 1.65;
    color: var(--muted); white-space: pre-wrap; word-break: break-word;
  }
  pre.log .log-line { color: var(--muted); }
  pre.log .log-level { font-weight: 600; }
  pre.log .log-line.lv-INFO { color: var(--log-info); }
  pre.log .log-line.lv-WARN { color: var(--log-warn); }
  pre.log .log-line.lv-ERROR { color: var(--log-error); }
  pre.log .log-line.lv-DEBUG { color: var(--log-debug); }
  pre.log .log-time { color: var(--dim); }
  .console.collapsed pre.log { display: none; }

  /* ---------- drawer ---------- */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 92vw);
    background: var(--panel); border-left: 1px solid var(--rule);
    transform: translateX(100%); transition: transform .18s ease-out;
    display: flex; flex-direction: column; z-index: 20;
  }
  .drawer.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
  .drawer-head {
    display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 12px;
    border-bottom: 1px solid var(--rule);
  }
  .drawer-head h2 {
    font-family: var(--sans); font-weight: 600; font-size: 21px; margin: 0; line-height: 1.15;
    overflow-wrap: anywhere;
  }
  .drawer-head .ref { color: var(--dim); font-size: 10.5px; margin-top: 4px; overflow-wrap: anywhere; }
  .drawer-close { margin-left: auto; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; }
  .drawer-actions {
    border-top: 1px solid var(--rule); padding: 12px 18px; display: flex; gap: 10px; align-items: center;
    flex-wrap: wrap;
  }
  .drawer-actions button { border: 1px solid var(--rule); padding: 6px 14px; color: var(--text); }
  .drawer-actions button:hover { background: var(--rule-soft); }
  .drawer-actions button:disabled { opacity: .5; cursor: default; }
  .drawer-actions button.primary { border-color: var(--work); color: var(--work); }
  .drawer-actions button.danger { border-color: var(--blocked); color: var(--blocked); }
  .drawer-actions .result { margin-left: auto; font-size: 10.5px; color: var(--muted); }
  .drawer-actions .result.ok { color: var(--done); }
  .drawer-actions .result.fail { color: var(--blocked); }
  .drawer-body { padding: 14px 18px 28px; overflow: auto; }
  .drawer-body h3 {
    font-family: var(--sans); font-weight: 600; font-size: 12px; letter-spacing: .14em;
    color: var(--muted); margin: 20px 0 6px;
  }
  .drawer-body h3:first-child { margin-top: 2px; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 3px 10px; font-size: 11px; }
  .kv dt { color: var(--dim); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .note {
    border-left: 2px solid var(--blocked); padding: 6px 10px; background: rgba(224,96,78,.07);
    color: var(--text); font-size: 11px; white-space: pre-wrap; margin: 8px 0;
  }
  .owner-note {
    border-left: 2px solid var(--work); padding: 8px 10px; background: rgba(240,165,63,.08);
    color: var(--text); font-size: 11.5px; white-space: pre-wrap; margin: 8px 0;
  }
  .checks { width: 100%; border-collapse: collapse; font-size: 11px; }
  .checks th, .checks td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
  .checks th { color: var(--dim); font-weight: 500; }
  .ok { color: var(--done); }
  .fail { color: var(--blocked); }
  .checks details summary { cursor: pointer; color: var(--muted); }
  .checks pre { white-space: pre-wrap; word-break: break-word; font-size: 10px; color: var(--muted); margin: 6px 0 0; }
  .plan {
    background: var(--ink); border: 1px solid var(--rule-soft); padding: 12px 14px;
    max-height: 420px; overflow: auto; font-size: 11.5px; line-height: 1.7;
  }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h2, .md h3, .md h4, .md h5, .md h6 {
    font-family: var(--sans); font-weight: 600; color: var(--text);
    letter-spacing: .04em; margin: 18px 0 6px; line-height: 1.25;
  }
  .md h2 { font-size: 17px; }
  .md h3 { font-size: 15px; }
  .md h4, .md h5, .md h6 { font-size: 13px; }
  .md p { margin: 0 0 10px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md li > p { margin: 0; }
  .md code {
    font-family: var(--mono); font-size: 10.5px; background: var(--ink-2);
    border: 1px solid var(--rule-soft); padding: 0 3px; overflow-wrap: anywhere;
  }
  .md pre {
    background: var(--ink-2); border: 1px solid var(--rule-soft); padding: 9px 10px;
    overflow: auto; margin: 0 0 10px;
  }
  .md pre code { background: none; border: 0; padding: 0; font-size: 10.5px; }
  .md blockquote {
    margin: 0 0 10px; padding: 4px 12px; border-left: 2px solid var(--rule); color: var(--muted);
  }
  .md hr { border: 0; border-top: 1px solid var(--rule); margin: 14px 0; }
  .md a { color: var(--wait); }
  .md table { border-collapse: collapse; width: 100%; margin: 0 0 10px; }
  .md th, .md td { border: 1px solid var(--rule-soft); padding: 4px 6px; text-align: left; }
  .md th { color: var(--muted); font-weight: 500; }
  .shots { display: grid; gap: 10px; }
  .shots figure { margin: 0; }
  .shots img { width: 100%; border: 1px solid var(--rule); display: block; }
  .shots figcaption { color: var(--dim); font-size: 10px; margin-top: 4px; }

  .link-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2px; }

  /* ---------- settings / setup ---------- */
  .settings {
    position: fixed; inset: 0; z-index: 30; display: none;
    background: rgba(6, 12, 14, .62); padding: 36px 16px; overflow: auto;
  }
  .settings.open { display: block; }
  .settings-panel {
    width: min(720px, 100%); margin: 0 auto; background: var(--panel);
    border: 1px solid var(--rule); box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
  }
  .settings-body { padding: 16px 18px 22px; display: flex; flex-direction: column; gap: 16px; }
  .settings-form { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 150px; }
  .field > span { color: var(--muted); font-size: 10.5px; letter-spacing: .04em; }
  .field input, .field select, .field textarea {
    background: var(--ink-2); border: 1px solid var(--rule); color: var(--text);
    font: inherit; font-size: 11.5px; padding: 5px 8px; width: 100%;
  }
  .field textarea { resize: vertical; min-height: 58px; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--focus); outline: none; }
  .field-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .check { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; padding-top: 18px; }
  .check input { accent-color: var(--work); }
  .settings-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .settings-actions button {
    border: 1px solid var(--rule); padding: 6px 13px; color: var(--text); font-size: 11px;
  }
  .settings-actions button:hover { background: var(--rule-soft); }
  .settings-actions button.primary { border-color: var(--work); color: var(--work); }
  .settings-actions button:disabled { opacity: .5; cursor: default; }
  .settings-update { border-top: 1px solid var(--rule); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .update-line { display: flex; gap: 16px; flex-wrap: wrap; color: var(--dim); font-size: 11px; }
  .update-line b { color: var(--text); font-weight: 500; }
  .settings .result { font-size: 10.5px; color: var(--muted); }
  .settings .result.ok { color: var(--done); }
  .settings .result.fail { color: var(--blocked); }
  .setup-note {
    border-left: 2px solid var(--work); background: rgba(240, 165, 63, .08);
    padding: 8px 11px; font-size: 11.5px; white-space: pre-wrap;
  }
  .detect-grid { display: flex; flex-direction: column; gap: 5px; font-size: 10.5px; color: var(--muted); }
  .detect-grid .detect-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .detect-grid .ok { color: var(--done); }
  .detect-grid .fail { color: var(--blocked); }

  /* Per-repo release rows: the repo list may grow, so each row is a compact
     line instead of a field grid. */
  .release { display: flex; flex-direction: column; gap: 7px; border-top: 1px solid var(--rule); padding-top: 11px; }
  .release-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

  function inlineNodes(source) {
    const frag = document.createDocumentFragment();
    const tokens = /(`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*|\[[^\]]+\]\([^)]+\))/g;
    let last = 0;
    let match;
    while ((match = tokens.exec(source))) {
      if (match.index > last) {
        frag.appendChild(document.createTextNode(source.slice(last, match.index)));
      }
      const token = match[0];
      if (token.startsWith("`")) {
        const code = document.createElement("code");
        code.textContent = token.slice(1, -1);
        frag.appendChild(code);
      } else if (token.startsWith("**")) {
        const strong = document.createElement("strong");
        strong.textContent = token.slice(2, -2);
        frag.appendChild(strong);
      } else if (token.startsWith("*")) {
        const em = document.createElement("em");
        em.textContent = token.slice(1, -1);
        frag.appendChild(em);
      } else {
        const link = token.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
        if (link && /^https?:\/\//i.test(link[2])) {
          const a = document.createElement("a");
          a.href = link[2];
          a.target = "_blank";
          a.rel = "noreferrer";
          a.textContent = link[1];
          a.addEventListener("click", (event) => {
            event.preventDefault();
            openExternal(link[2]);
          });
          frag.appendChild(a);
        } else {
          frag.appendChild(document.createTextNode(token));
        }
      }
      last = tokens.lastIndex;
    }
    if (last < source.length) {
      frag.appendChild(document.createTextNode(source.slice(last)));
    }
    return frag;
  }

  function splitRow(line) {
    return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
  }

  function renderMarkdown(source) {
    const root = document.createElement("div");
    root.className = "md";
    const lines = String(source || "").replace(/\r\n/g, "\n").split("\n");
    let i = 0;
    const startsBlock = (line) =>
      /^\s*```/.test(line) || /^#{1,6}\s+/.test(line) || /^\s*([-*+]|\d+\.)\s+/.test(line) ||
      /^\s*>/.test(line) || /^\s*(---|\*\*\*|___)\s*$/.test(line) || /^\s*\|/.test(line);

    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }

      const fence = line.match(/^\s*```(\S*)\s*$/);
      if (fence) {
        const body = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) body.push(lines[i++]);
        i++;
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        if (fence[1]) code.dataset.lang = fence[1];
        code.textContent = body.join("\n");
        pre.appendChild(code);
        root.appendChild(pre);
        continue;
      }

      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        const level = Math.min(heading[1].length + 1, 6);
        const el = document.createElement("h" + level);
        el.appendChild(inlineNodes(heading[2]));
        root.appendChild(el);
        i++;
        continue;
      }

      if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) {
        root.appendChild(document.createElement("hr"));
        i++;
        continue;
      }

      if (/^\s*>/.test(line)) {
        const body = [];
        while (i < lines.length && (/^\s*>/.test(lines[i]) || !lines[i].trim())) {
          body.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        const quote = document.createElement("blockquote");
        quote.appendChild(inlineNodes(body.join(" ").trim()));
        root.appendChild(quote);
        continue;
      }

      if (/^\s*([-*+])\s+/.test(line)) {
        const list = document.createElement("ul");
        while (i < lines.length && /^\s*([-*+])\s+/.test(lines[i])) {
          const item = document.createElement("li");
          item.appendChild(inlineNodes(lines[i].replace(/^\s*[-*+]\s+/, "")));
          list.appendChild(item);
          i++;
        }
        root.appendChild(list);
        continue;
      }

      if (/^\s*\d+\.\s+/.test(line)) {
        const list = document.createElement("ol");
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          const item = document.createElement("li");
          item.appendChild(inlineNodes(lines[i].replace(/^\s*\d+\.\s+/, "")));
          list.appendChild(item);
          i++;
        }
        root.appendChild(list);
        continue;
      }

      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|/.test(lines[i + 1])) {
        const header = splitRow(lines[i]);
        i += 2;
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        for (const cell of header) {
          const th = document.createElement("th");
          th.appendChild(inlineNodes(cell));
          headRow.appendChild(th);
        }
        thead.appendChild(headRow);
        table.appendChild(thead);
        const tbody = document.createElement("tbody");
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          const tr = document.createElement("tr");
          for (const cell of splitRow(lines[i])) {
            const td = document.createElement("td");
            td.appendChild(inlineNodes(cell));
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
          i++;
        }
        table.appendChild(tbody);
        root.appendChild(table);
        continue;
      }

      const para = [];
      while (i < lines.length && lines[i].trim() && !startsBlock(lines[i])) {
        para.push(lines[i].trim());
        i++;
      }
      const p = document.createElement("p");
      p.appendChild(inlineNodes(para.join(" ")));
      root.appendChild(p);
    }
    return root;
  }

  function fmtTime(raw) {
    if (!raw) return "–";
    const date = new Date(raw);
    if (Number.isNaN(date.getTime())) return raw;
    return date.toLocaleString(state.lang === "zh" ? "zh-CN" : "en-US", { hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  function humanAge(seconds) {
    if (!seconds || seconds < 0) return "–";
    if (seconds < 60) return seconds + "s";
    if (seconds < 3600) return Math.floor(seconds / 60) + "m";
    if (seconds < 86400) return Math.floor(seconds / 3600) + "h";
    return Math.floor(seconds / 86400) + "d";
  }

  function setText(id, value) {

  // Each repository owns its own plan/work pool, so the limit is rendered on
  // the repository line instead of once for the whole daemon.
  function miniMeter(label, active, limit) {
    const box = document.createElement("div");
    box.className = "mini-meter";
    box.title = t("line.limitHint");
    const head = document.createElement("div");
    head.className = "mini-head";
    head.appendChild(text("span", label, "mini-label"));
    head.appendChild(text("span", active + "/" + limit, "mini-num"));
    const holder = document.createElement("div");
    holder.className = "mini-cells";
    const slots = Math.min(Math.max(limit, active, 1), 12);
    for (let i = 0; i < slots; i++) {
      const cell = document.createElement("span");
      cell.className = "cell" + (i < active ? " on" : "");
      holder.appendChild(cell);
    }
    box.append(head, holder);
    return box;
  }

  function renderHeader(data) {

  function renderLines(data) {
    const holder = $("lines");

      const repoTasks = data.tasks.filter((task) => task.repo === repo.name);
      const planActive = repoTasks.filter((task) => task.active && task.phase === "planning").length;
      const workActive = repoTasks.filter((task) => task.active && (task.phase === "implementing" || task.phase === "merging")).length;
      const pools = document.createElement("div");
      pools.className = "line-pools";
      pools.appendChild(miniMeter(t("line.plan"), planActive, data.planLimit));

      line.appendChild(pools);

      const foot = document.createElement("div");
      foot.className = "line-foot";

  function stepState(task) {
    const meta = phaseMeta(task.phase);
    const now = meta.step;
    const blocked = task.phase === "blocked";
    const cancelled = task.phase === "cancelled";
    const done = task.phase === "done";
    return { meta, now, blocked, cancelled, done };
  }

  function renderRail(task) {
    const rail = document.createElement("ol");
    rail.className = "rail";
    const { now, blocked, cancelled, done } = stepState(task);
    const effective = blocked ? (task.prNumber ? 5 : 3) : now;
    for (let step = 1; step <= 6; step++) {
      const item = document.createElement("li");
      if (cancelled) item.className = "skip";
      else if (done) item.className = "done";
      else if (blocked && step === effective) item.className = "blocked";
      else if (step < effective) item.className = "done";
      else if (step === effective) item.className = "now";
      item.appendChild(document.createElement("i"));
      item.title = t(["rail.plan", "rail.approve", "rail.implement", "rail.checks", "rail.pr", "rail.merge"][step - 1]);
      rail.appendChild(item);
    }
    return rail;
  }

  function updateRepoFilter(data) {
    const select = $("repo-filter");
    const counts = new Map();
    for (const task of data.tasks) counts.set(task.repo, (counts.get(task.repo) || 0) + 1);
    const names = data.repos.map((repo) => repo.name);
    for (const name of counts.keys()) if (!names.includes(name)) names.push(name);
    if (state.repo && !names.includes(state.repo)) state.repo = "";
    const signature = names.map((n) => `${n}:${counts.get(n) || 0}`).join("|") + `#${state.repo}#${state.lang}`;
    if (select.dataset.sig === signature) return;
    select.dataset.sig = signature;
    const fragment = document.createDocumentFragment();
    const all = document.createElement("option");
    all.value = "";
    all.textContent = `${t("filter.allProjects")} (${data.tasks.length})`;
    fragment.appendChild(all);
    for (const name of names) {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = `${name} (${counts.get(name) || 0})`;
      fragment.appendChild(option);
    }
    select.replaceChildren(fragment);
    select.value = state.repo;
  }

  function matches(task) {
    if (state.repo && task.repo !== state.repo) return false;
    if (state.hideFinished && (task.phase === "done" || task.phase === "cancelled")) return false;
    if (state.filter === "active" && !(task.active || task.queued)) return false;
    if (state.filter === "wait" && !needsMe(task)) return false;
    if (state.filter === "blocked" && task.phase !== "blocked") return false;
    const needle = state.search.trim().toLowerCase();
    if (needle) {
      const hay = `${task.repo} ${task.number} ${task.title}`.toLowerCase();
      if (!hay.includes(needle)) return false;
    }
    return true;
  }

  function renderTasks(data) {
    const body = $("tasks");
    const rows = data.tasks.filter(matches);
    if (rows.length === 0) {
      body.replaceChildren();
      $("empty").hidden = false;
      const filtered = data.tasks.length !== 0;
      $("empty").querySelector("strong").textContent = filtered ? t("empty.filtered.title") : t("empty.none.title");
      $("empty-hint").textContent = filtered ? t("empty.filtered.hint") : t("empty.none.hint");
      return;
    }
    $("empty").hidden = true;
    const frag = document.createDocumentFragment();
    for (const task of rows) {
      const tr = document.createElement("tr");
      tr.dataset.repo = task.repo;
      tr.dataset.number = String(task.number);
      tr.tabIndex = 0;
      if (state.selected && state.selected.repo === task.repo && state.selected.number === task.number) {
        tr.classList.add("selected");
      }

      const issueCell = document.createElement("td");
      issueCell.className = "issue-cell";
      const ref = document.createElement("span");
      ref.className = "issue-ref";
      ref.appendChild(icon("dot" + (task.active ? " active" : task.queued ? " queued" : "")));
      ref.appendChild(document.createTextNode(`${task.repo} #${task.number}`));
      issueCell.appendChild(ref);
      issueCell.appendChild(text("span", task.title || "issue #" + task.number, "issue-title"));

      const phaseCell = document.createElement("td");
      const meta = phaseMeta(task.phase);
      phaseCell.appendChild(text("span", phaseLabel(task.phase), "stamp " + meta.cls));

      const railCell = document.createElement("td");
      railCell.className = "rail-cell";
      railCell.appendChild(renderRail(task));

      const timeCell = document.createElement("td");
      timeCell.className = "time-cell";
      timeCell.appendChild(text("span", humanAge(task.elapsedSec), "time"));

      const prCell = document.createElement("td");
      prCell.className = "pr-cell";
      if (task.prNumber) {
        const link = document.createElement("a");
        link.href = task.prUrl || "#";
        link.target = "_blank";
        link.rel = "noreferrer";
        link.textContent = "#" + task.prNumber;
        link.className = "pr";
        link.addEventListener("click", (event) => {
          event.stopPropagation();
          event.preventDefault();
          openExternal(link.href);
        });
        prCell.appendChild(link);
      } else {
        prCell.appendChild(text("span", "–", "time"));
      }

      tr.append(issueCell, phaseCell, railCell, timeCell, prCell);
      tr.addEventListener("click", () => selectTask(task));
      tr.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectTask(task);
        }
      });
      frag.appendChild(tr);
    }
    body.replaceChildren(frag);
  }

  async function selectTask(task) {
    if (state.selected && state.selected.repo === task.repo && state.selected.number === task.number) {
      closeDrawer();
      return;
    }
    state.selected = { repo: task.repo, number: task.number };
    state.drawerSig = "";
    markSelectedRow();
    try {
      const response = await fetch(`/api/issue?repo=${encodeURIComponent(task.repo)}&number=${task.number}`);
      if (!response.ok) throw new Error("HTTP " + response.status);
      renderDrawer(await response.json(), task);
    } catch (err) {
      renderDrawerError(err);
    }
  }

  function markSelectedRow() {
    for (const row of $("tasks").querySelectorAll("tr")) {
      const on = state.selected && row.dataset.repo === state.selected.repo && row.dataset.number === String(state.selected.number);
      row.classList.toggle("selected", !!on);
    }
  }

  function closeDrawer() {
    state.selected = null;
    state.drawerSig = "";
    $("drawer").classList.remove("open");
    $("drawer").setAttribute("aria-hidden", "true");
    markSelectedRow();
  }

  function renderDrawer(issue, task) {
    const drawer = $("drawer");
    $("d-title").textContent = task.title || `issue #${task.number}`;
    $("d-ref").textContent = `${task.repo} #${task.number}`;
    const body = $("d-body");
    body.replaceChildren();

    const links = document.createElement("div");
    links.className = "link-row";
    if (task.url) {
      const a = document.createElement("a");
      a.href = task.url; a.target = "_blank"; a.rel = "noreferrer"; a.textContent = t("drawer.openIssue");
      a.addEventListener("click", (event) => { event.preventDefault(); openExternal(a.href); });
      links.appendChild(a);
    }
    if (task.prUrl) {
      const a = document.createElement("a");
      a.href = task.prUrl; a.target = "_blank"; a.rel = "noreferrer"; a.textContent = t("drawer.openPR", { n: task.prNumber });
      a.addEventListener("click", (event) => { event.preventDefault(); openExternal(a.href); });
      links.appendChild(a);
    }
    if (links.childNodes.length) body.appendChild(links);

    if (issue.blockedReason) {
      body.appendChild(text("div", issue.blockedReason, "note"));
    }

    body.appendChild(text("h3", t("drawer.status")));
    const kv = document.createElement("dl");
    kv.className = "kv";
    const addKV = (key, value) => {
      kv.appendChild(text("dt", key));
      kv.appendChild(text("dd", value || "–"));
    };
    addKV(t("drawer.phase"), phaseLabel(issue.phase));
    addKV(t("drawer.started"), fmtTime(issue.startedAt));
    addKV(t("drawer.updated"), fmtTime(issue.updatedAt));
    addKV(t("drawer.branch"), issue.branch || "–");
    addKV(t("drawer.worktree"), issue.worktree || "–");
    addKV(t("drawer.session"), issue.sessionId || "–");
    body.appendChild(kv);

    if (issue.checks && issue.checks.length) {
      body.appendChild(text("h3", t("drawer.checks")));
      const table = document.createElement("table");
      table.className = "checks";
      const thead = document.createElement("thead");
      const hr = document.createElement("tr");
      hr.append(text("th", t("drawer.name")), text("th", t("drawer.result")), text("th", t("drawer.duration")));
      thead.appendChild(hr);
      table.appendChild(thead);
      const tbody = document.createElement("tbody");
      for (const check of issue.checks) {
        const tr = document.createElement("tr");
        const name = document.createElement("td");
        if (check.outputTail) {
          const details = document.createElement("details");
          details.appendChild(text("summary", check.name || check.cmd));
          details.appendChild(text("pre", check.outputTail));
          name.appendChild(details);
        } else {
          name.textContent = check.name || check.cmd;
        }
        tr.appendChild(name);
        tr.appendChild(text("td", check.ok ? t("drawer.pass") : t("drawer.fail"), check.ok ? "ok" : "fail"));
        tr.appendChild(text("td", (check.durationSec || 0) + "s"));
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      body.appendChild(table);
    }

    if (issue.screenshots && issue.screenshots.length) {
      body.appendChild(text("h3", t("drawer.screenshots")));
      const shots = document.createElement("div");
      shots.className = "shots";
      for (const shot of issue.screenshots) {
        const figure = document.createElement("figure");
        const img = document.createElement("img");
        img.src = shot.url;
        img.alt = shot.caption || t("drawer.shotAlt");
        img.loading = "lazy";
        figure.appendChild(img);
        figure.appendChild(text("figcaption", shot.caption || ""));
        shots.appendChild(figure);
      }
      body.appendChild(shots);
    }

    if (issue.extraNotes) {
      body.appendChild(text("h3", t("drawer.notes")));
      body.appendChild(text("div", issue.extraNotes, "owner-note"));
    }

    if (issue.plan) {
      body.appendChild(text("h3", t("drawer.plan")));
      const plan = renderMarkdown(issue.plan);
      plan.classList.add("plan");
      body.appendChild(plan);
    }

    renderActions(task, issue);

    drawer.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
  }

  function renderActions(task, issue) {
    const holder = $("d-actions");
    holder.replaceChildren();
    const phase = issue.phase;
    const canApprove = phase === "awaiting_approval" || phase === "blocked";
    const canCancel = ["new", "planning", "awaiting_approval", "blocked", "implementing", "pr_open"].includes(phase);
    if (!canApprove && !canCancel) {
      holder.hidden = true;
      return;
    }
    holder.hidden = false;
    if (canApprove) {
      const button = document.createElement("button");
      button.className = "primary";
      button.textContent = phase === "blocked" ? t("action.continue") : t("action.approve");
      button.addEventListener("click", () => runAction(task, "approve"));
      holder.appendChild(button);
    }
    if (canCancel) {
      const button = document.createElement("button");
      button.className = "danger";
      button.textContent = t("action.cancel");
      button.addEventListener("click", () => runAction(task, "cancel"));
      holder.appendChild(button);
    }
    const result = document.createElement("span");
    result.className = "result";
    holder.appendChild(result);
  }

  async function runAction(task, action) {
    const question = action === "approve" ? t("action.confirmApprove") : t("action.confirmCancel");
    if (!window.confirm(question)) return;
    const holder = $("d-actions");
    const result = holder.querySelector(".result");
    for (const button of holder.querySelectorAll("button")) button.disabled = true;
    result.className = "result";
    result.textContent = t("action.submitting");
    try {
      const response = await fetch("/api/action", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ repo: task.repo, number: task.number, action }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "HTTP " + response.status);
      result.className = "result ok";
      result.textContent = action === "approve" ? t("action.approved") : t("action.cancelled");
      setTimeout(refreshState, 800);
    } catch (err) {
      result.className = "result fail";
      result.textContent = t("action.failed", { msg: err.message });
      for (const button of holder.querySelectorAll("button")) button.disabled = false;
    }
  }

  function renderDrawerError(err) {
    const body = $("d-body");
    body.replaceChildren(text("div", t("drawer.failed", { msg: err.message }), "note"));
    $("drawer").classList.add("open");
    $("drawer").setAttribute("aria-hidden", "false");
  }

  function renderLogLines(raw) {
    const lines = raw.split("\n");
    const frag = document.createDocumentFragment();
    for (const line of lines) {
      // daemon.log format: 2026-01-02T03:04:05Z INFO  message. Keep the API
      // plain text and split it here only for colouring.
      const match = line.match(/^(\S+)\s+(INFO|WARN|ERROR|DEBUG)\s+(.*)$/);
      if (!match) {
        frag.appendChild(document.createTextNode(line + "\n"));
        continue;
      }
      const span = document.createElement("span");
      span.className = "log-line lv-" + match[2];
      span.appendChild(text("span", match[1] + " ", "log-time"));
      span.appendChild(text("span", match[2], "log-level"));
      span.appendChild(document.createTextNode(" " + match[3] + "\n"));
      frag.appendChild(span);
    }
    const log = $("log");
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
    log.replaceChildren(frag);
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  const AGENT_FALLBACK = [
    { id: "opencode", name: "opencode" },
    { id: "claude", name: "Claude Code" },
    { id: "codex", name: "Codex CLI" },
  ];

  function settingsResult(message, cls) {
    const result = $("settings-result");
    result.textContent = message || "";
    result.className = "result" + (cls ? " " + cls : "");
  }

  function formError(message) {
    settingsResult(t("settings.failed", { msg: message }), "fail");
  }

  function repoList(doc) {
    const value = doc && doc.repos;
    if (Array.isArray(value)) {
      return value.map((item) => (typeof item === "string" ? item : (item && item.repo) || "")).filter(Boolean);
    }
    if (value && typeof value === "object") return Object.keys(value).sort();
    return [];
  }

  // Repos may be a plain array, an array of objects with overrides, or an
  // object keyed by name. Keep the overrides of repos that stay, and only
  // add/remove names.
  function setRepoList(doc, names) {
    const original = doc.repos;
    if (Array.isArray(original) && original.some((item) => item && typeof item === "object")) {
      const byName = new Map();
      for (const item of original) {
        if (item && typeof item === "object" && typeof item.repo === "string") byName.set(item.repo, item);
      }
      doc.repos = names.map((name) => {
        const existing = byName.get(name);
        return existing ? { ...existing, repo: name } : { repo: name };
      });
      return;
    }
    if (!original || Array.isArray(original)) {
      doc.repos = names;
      return;
    }
    const next = {};
    for (const name of names) {
      const existing = original[name];
      next[name] = existing && typeof existing === "object" ? existing : {};
    }
    doc.repos = next;
  }

  function parseRepoNames(text) {
    return [...new Set(text
      .split(/[\s,;]+/)
      .map((value) => value.trim())
      .filter(Boolean)
      .map((value) => value
        .replace(/^https?:\/\/github\.com\//i, "")
        .replace(/\.git$/i, "")
        .replace(/^\/+|\/+$/g, ""))
      .filter(Boolean))];
  }

  function parseRepos(text) {
    const names = parseRepoNames(text);
    if (!names.length) throw new Error(t("settings.repoRequired"));
    return names;
  }

  // releaseDefaults and releaseValue mirror normalizeRelease in config.go: one
  // day between checks unless the config says otherwise. The bump part is not
  // stored: a feature commit bumps minor, everything else patch.
  function releaseDefaults() {
    const defaults = (state.configDefaults && state.configDefaults.release) || {};
    const interval = Number(defaults.intervalDays);
    return {
      enabled: defaults.enabled === true,
      intervalDays: Number.isInteger(interval) && interval >= 1 ? interval : 1,
    };
  }

  function repoEntry(doc, name) {
    const repos = doc && doc.repos;
    if (Array.isArray(repos)) {
      return repos.find((item) => item && typeof item === "object" && item.repo === name) || null;
    }
    if (repos && typeof repos === "object") return repos[name] || null;
    return null;
  }

  function releaseValue(doc, name) {
    const base = releaseDefaults();
    const entry = repoEntry(doc, name);
    const release = entry && entry.release && typeof entry.release === "object" ? entry.release : {};
    const interval = Number(release.intervalDays);
    return {
      enabled: release.enabled === true,
      intervalDays: Number.isInteger(interval) && interval >= 1 ? interval : base.intervalDays,
    };
  }

  function releaseLabel(key) {
    const label = text("span", t(key), "");
    label.dataset.i18n = key;
    return label;
  }

  function releaseRow(name, value) {
    const row = document.createElement("div");
    row.className = "release-row";
    row.dataset.repo = name;
    row.appendChild(text("span", name, "repo"));

    const enabled = document.createElement("label");
    enabled.className = "check";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = value.enabled === true;
    enabled.append(checkbox, releaseLabel("settings.releaseEnabled"));
    row.appendChild(enabled);

    const interval = document.createElement("label");
    interval.appendChild(releaseLabel("settings.releaseInterval"));
    const input = document.createElement("input");
    input.type = "number";
    input.min = "1";
    input.step = "1";
    input.value = value.intervalDays === undefined || value.intervalDays === null ? "1" : String(value.intervalDays);
    interval.appendChild(input);
    row.appendChild(interval);
    return row;
  }

  // readReleaseRows keeps whatever the user typed, including an invalid
  // interval, so changing the repo list does not silently rewrite the field.
  function readReleaseRows() {
    const rows = {};
    for (const row of document.querySelectorAll("#cfg-releases .release-row")) {
      rows[row.dataset.repo] = {
        enabled: row.querySelector("input[type=checkbox]").checked,
        intervalDays: row.querySelector("input[type=number]").value,
      };
    }
    return rows;
  }

  function renderReleases(doc, names, keepEdits) {
    const block = $("cfg-release");
    const holder = $("cfg-releases");
    block.hidden = names.length === 0;
    if (!names.length) {
      holder.replaceChildren();
      return;
    }
    const edited = keepEdits ? readReleaseRows() : {};
    const fragment = document.createDocumentFragment();
    for (const name of names) fragment.appendChild(releaseRow(name, edited[name] || releaseValue(doc, name)));
    holder.replaceChildren(fragment);
  }

  function releaseIsSet(value, defaults) {
    return value.enabled || Number(value.intervalDays) !== defaults.intervalDays;
  }

  // repoObjects turns the array-of-names form into objects so a release block
  // can sit next to codingAgent/model/language. The keyed object form and the
  // array-of-objects form are already per-repo.
  function repoObjects(doc, names) {
    const repos = doc.repos;
    if (repos && !Array.isArray(repos) && typeof repos === "object") return;
    const existing = new Map();
    if (Array.isArray(repos)) {
      for (const item of repos) {
        if (item && typeof item === "object" && typeof item.repo === "string") existing.set(item.repo, { ...item });
        else if (typeof item === "string") existing.set(item, { repo: item });
      }
    }
    doc.repos = names.map((name) => existing.get(name) || { repo: name });
  }

  function mutableRepoEntry(doc, name) {
    const repos = doc.repos;
    if (Array.isArray(repos)) {
      return repos.find((item) => item && typeof item === "object" && item.repo === name) || null;
    }
    if (repos && typeof repos === "object") {
      if (!repos[name] || typeof repos[name] !== "object") repos[name] = {};
      return repos[name];
    }
    return null;
  }

  function applyReleases(doc, names) {
    const defaults = releaseDefaults();
    const edited = readReleaseRows();
    const values = names.map((name) => [name, edited[name] || releaseValue(doc, name)]);
    if (values.some(([, value]) => releaseIsSet(value, defaults))) repoObjects(doc, names);
    for (const [name, value] of values) {
      const entry = mutableRepoEntry(doc, name);
      if (!entry) continue;
      if (!releaseIsSet(value, defaults)) {
        delete entry.release;
        continue;
      }
      const interval = Number(value.intervalDays);
      entry.release = {
        enabled: Boolean(value.enabled),
        intervalDays: Number.isInteger(interval) && interval >= 1 ? interval : defaults.intervalDays,
      };
    }
  }

  function releaseRowsValid(names) {
    const edited = readReleaseRows();
    for (const name of names) {
      const value = edited[name];
      if (!value) continue;
      const interval = Number(value.intervalDays);
      if (!Number.isInteger(interval) || interval < 1) return false;
    }
    return true;
  }

  function renderAgents(current) {
    const select = $("cfg-agent");
    const seen = new Set();
    select.replaceChildren();
    for (const agent of state.agents.length ? state.agents : AGENT_FALLBACK) {
      const id = typeof agent === "string" ? agent : agent.id;
      if (!id || seen.has(id)) continue;
      seen.add(id);
      const option = document.createElement("option");
      option.value = id;
      option.textContent = agent.version ? id + " · " + agent.version : id;
      select.appendChild(option);
    }
    if (current && !seen.has(current)) {
      const option = document.createElement("option");
      option.value = current;
      option.textContent = current;
      select.appendChild(option);
    }
    select.value = current || "opencode";
  }

  function renderModels(models) {
    const list = $("cfg-models");
    const fragment = document.createDocumentFragment();
    for (const model of models) {
      const option = document.createElement("option");
      option.value = model;
      fragment.appendChild(option);
    }
    list.replaceChildren(fragment);
  }

  function renderDetected(data) {
    const holder = $("settings-detected");
    holder.replaceChildren();
    const row = (label, values) => {
      if (!values.length) return;
      const line = document.createElement("div");
      line.className = "detect-row";
      line.appendChild(text("span", label + ":", ""));
      for (const value of values) line.appendChild(value.nodeType ? value : text("span", value, ""));
      holder.appendChild(line);
    };
    const agents = (data.agents || []).map((agent) => {
      const label = agent.version ? agent.id + " · " + agent.version : agent.id;
      return text("span", label, "ok");
    });
    row(t("settings.detectedAgents"), agents.length ? agents : [t("settings.noAgents")]);
    if (data.proxy) row(t("settings.detectedProxy"), [text("span", data.proxy, "ok")]);
    const repos = (data.repos || []).map((repo) => {
      const cls = repo.permission === "admin" || repo.permission === "write" ? "ok" : "fail";
      const note = repo.error ? " (" + repo.error + ")" : "";
      return text("span", repo.repo + " · " + repo.permission + note, cls);
    });
    row(t("settings.detectedRepos"), repos);
    if (data.error) row("!", [text("span", data.error, "fail")]);
    holder.hidden = holder.childElementCount === 0;
  }

  function applyConfigPayload(data) {
    state.configDoc = data.config || {};
    state.configDefaults = data.defaults || {};
    const doc = state.configDoc;
    const pick = (key, fallback) => (doc[key] !== undefined ? doc[key] : (state.configDefaults[key] !== undefined ? state.configDefaults[key] : fallback));
    $("settings-path").textContent = data.path + (data.exists ? "" : " · " + t("settings.newFile"));
    $("settings-version").textContent = data.version || "–";
    const repos = repoList(doc);
    $("cfg-repos").value = repos.join("\n");
    renderReleases(doc, repos, false);
    renderAgents(pick("codingAgent", "opencode"));
    $("cfg-model").value = pick("model", "");
    $("cfg-proxy").value = pick("proxy", "");
    $("cfg-webport").value = doc.webPort !== undefined ? doc.webPort : 0;
    $("cfg-updateproxy").value = pick("updateProxy", "");
    $("cfg-selfupdate").checked = Boolean(pick("selfUpdate", false));
    renderModels([]);
    $("settings-detected").hidden = true;
    $("update-apply").hidden = true;
    $("update-status").textContent = "";
    const note = $("settings-note");
    const problem = data.configError || data.error || "";
    note.hidden = !problem;
    note.textContent = problem ? t("settings.setupHint") + "\n" + problem : "";
  }

  async function loadConfig() {
    try {
      const response = await fetch("/api/config", { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      applyConfigPayload(await response.json());
    } catch (err) {
      formError(err.message);
    }
  }

  function openSettings() {
    $("settings").classList.add("open");
    $("settings").setAttribute("aria-hidden", "false");
    state.settingsOpen = true;
    state.setupShown = true;
    loadConfig();
  }

  function closeSettings() {
    $("settings").classList.remove("open");
    $("settings").setAttribute("aria-hidden", "true");
    state.settingsOpen = false;
  }

  async function saveSettings(event) {
    event.preventDefault();
    const doc = JSON.parse(JSON.stringify(state.configDoc || {}));
    let repos;
    try {
      repos = parseRepos($("cfg-repos").value);
    } catch (err) {
      formError(err.message);
      return;
    }
    if (!releaseRowsValid(repos)) {
      formError(t("settings.releaseIntervalInvalid"));
      return;
    }
    setRepoList(doc, repos);
    applyReleases(doc, repos);
    const assign = (key, value) => {
      if (value === "" || value === null || value === undefined) delete doc[key];
      else doc[key] = value;
    };
    assign("codingAgent", $("cfg-agent").value);
    assign("model", $("cfg-model").value.trim());
    assign("proxy", $("cfg-proxy").value.trim());
    assign("updateProxy", $("cfg-updateproxy").value.trim());
    const port = Number($("cfg-webport").value);
    doc.webPort = Number.isFinite(port) && port >= 0 && port <= 65535 ? Math.trunc(port) : 0;
    doc.selfUpdate = $("cfg-selfupdate").checked;
    settingsResult(t("settings.saving"), "");
    const buttons = document.querySelectorAll(".settings-actions button");
    for (const button of buttons) button.disabled = true;
    try {
      const response = await fetch("/api/config", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ config: doc }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "HTTP " + response.status);
      state.configDoc = doc;
      settingsResult(t("settings.saved"), "ok");
      if (state.data && state.data.configError) setTimeout(closeSettings, 1200);
      setTimeout(refreshState, 1500);
    } catch (err) {
      formError(err.message);
    } finally {
      for (const button of buttons) button.disabled = false;
    }
  }

  async function runDetect() {
    const button = $("settings-detect");
    button.disabled = true;
    settingsResult(t("settings.detecting"), "");
    try {
      const params = new URLSearchParams({ agent: $("cfg-agent").value || "", proxy: "1" });
      try {
        const repos = parseRepos($("cfg-repos").value);
        if (repos.length) params.set("repos", repos.join(","));
      } catch (_) { /* no repos yet: agents/models still work */ }
      const response = await fetch("/api/detect?" + params.toString(), { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      state.agents = data.agents || [];
      renderAgents($("cfg-agent").value);
      renderModels(data.models || []);
      renderDetected(data);
      settingsResult(t("settings.detected"), "ok");
    } catch (err) {
      formError(err.message);
    } finally {
      button.disabled = false;
    }
  }

  async function restartEngine() {
    settingsResult(t("settings.restarting"), "");
    try {
      const response = await fetch("/api/restart", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "HTTP " + response.status);
      settingsResult(t("settings.restarting"), "ok");
    } catch (err) {
      formError(err.message);
    }
  }

  function renderUpdate(payload) {
    state.update = payload;
    if (payload.error) {
      $("update-status").textContent = t("settings.updateFailed", { msg: payload.error });
      $("update-apply").hidden = true;
      return;
    }
    $("update-status").textContent = payload.available
      ? t("settings.updateAvailable", { latest: payload.latest })
      : t("settings.updateCurrent", { current: payload.current });
    $("update-apply").hidden = !payload.available;
  }

  async function checkUpdate() {
    const button = $("update-check");
    button.disabled = true;
    $("update-status").textContent = t("settings.updateChecking");
    try {
      const response = await fetch("/api/update", { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      renderUpdate(await response.json());
    } catch (err) {
      $("update-status").textContent = t("settings.updateFailed", { msg: err.message });
    } finally {
      button.disabled = false;
    }
  }

  async function installUpdate() {
    const button = $("update-apply");
    button.disabled = true;
    $("update-status").textContent = t("settings.updateInstalling");
    try {
      const response = await fetch("/api/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "HTTP " + response.status);
      if (data.error) throw new Error(data.error);
      $("update-status").textContent = t("settings.updateInstalled", { latest: data.latest });
    } catch (err) {
      $("update-status").textContent = t("settings.updateFailed", { msg: err.message });
    } finally {
      button.disabled = false;
    }
  }

  async function refreshState() {
    try {
      const response = await fetch("/api/state", { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      state.failures = 0;
      state.down = false;
      const changed = !state.data || JSON.stringify(state.data) !== JSON.stringify(data);
      state.data = data;
      if (data.configError && !state.settingsOpen && !state.setupShown) openSettings();
      renderHeader(data);
      renderLines(data);
      updateChips(data);
      updateRepoFilter(data);
      if (changed) renderTasks(data);
      if (state.selected) {
        const task = data.tasks.find((t) => t.repo === state.selected.repo && t.number === state.selected.number);
        if (task) $("d-title").textContent = task.title;
        const issue = await fetch(`/api/issue?repo=${encodeURIComponent(state.selected.repo)}&number=${state.selected.number}`).then((r) => r.ok ? r.json() : null);
        if (issue) {
          const sig = JSON.stringify([issue.phase, issue.blockedReason, issue.extraNotes, (issue.checks || []).map((c) => [c.name, c.ok]), (issue.screenshots || []).length]);
          if (sig !== state.drawerSig) {
            state.drawerSig = sig;
            renderDrawer(issue, task || { repo: state.selected.repo, number: state.selected.number });
          }
        }
      }
    } catch (err) {
      state.failures++;
      state.down = true;
      state.live = false;
      $("s-daemon").replaceChildren(icon("lamp stopped"), document.createTextNode("down · retry " + state.failures));
    }
  }

  async function refreshLogs() {
    if (state.logPaused || !state.logOpen) return;
    try {
      const response = await fetch("/api/logs?lines=160", { cache: "no-store" });
      if (!response.ok) return;
      renderLogLines(await response.text());
    } catch (_) { /* the state poll reports the connection problem */ }
  }

  function wire() {
    initTheme();
    initLanguage();
    for (const chip of document.querySelectorAll(".chip[data-filter]")) {
      chip.addEventListener("click", () => {
        state.filter = chip.dataset.filter;
        for (const other of document.querySelectorAll(".chip[data-filter]")) {
          other.setAttribute("aria-pressed", other === chip ? "true" : "false");
        }
        if (state.data) renderTasks(state.data);
      });
    }
    $("hide-finished").addEventListener("click", () => {
      state.hideFinished = !state.hideFinished;
      $("hide-finished").setAttribute("aria-pressed", String(state.hideFinished));
      if (state.data) {
        updateChips(state.data);
        renderTasks(state.data);
      }
    });
    $("repo-filter").addEventListener("change", (event) => {
      state.repo = event.target.value;
      if (state.data) renderTasks(state.data);
    });
    $("search").addEventListener("input", (event) => {
      state.search = event.target.value;
      if (state.data) renderTasks(state.data);
    });
    $("d-close").addEventListener("click", closeDrawer);
    $("gh-link").addEventListener("click", (event) => {
      event.preventDefault();
      openExternal($("gh-link").href);
    });
    $("settings-open").addEventListener("click", () => (state.settingsOpen ? closeSettings() : openSettings()));
    $("settings-close").addEventListener("click", closeSettings);
    $("settings-form").addEventListener("submit", saveSettings);
    $("cfg-repos").addEventListener("input", () => {
      // Render a row per repo while typing, keeping the values already entered
      // for repos that stay in the list.
      renderReleases(state.configDoc || {}, parseRepoNames($("cfg-repos").value), true);
    });
    $("settings-detect").addEventListener("click", runDetect);
    $("settings-restart").addEventListener("click", restartEngine);
    $("settings-reload").addEventListener("click", loadConfig);
    $("update-check").addEventListener("click", checkUpdate);
    $("update-apply").addEventListener("click", installUpdate);
    $("settings").addEventListener("click", (event) => {
      if (event.target === $("settings")) closeSettings();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      closeDrawer();
      if (state.settingsOpen) closeSettings();
    });
    $("log-toggle").addEventListener("click", () => {
      state.logOpen = !state.logOpen;
      $("console").classList.toggle("collapsed", !state.logOpen);
      $("log-toggle").textContent = state.logOpen ? t("log.collapse") : t("log.expand");
      $("log-toggle").setAttribute("aria-expanded", String(state.logOpen));
      if (state.logOpen) refreshLogs();
    });
    $("log-pause").addEventListener("click", () => {
      state.logPaused = !state.logPaused;
      $("log-pause").textContent = state.logPaused ? t("log.resume") : t("log.pause");
      $("log-pause").setAttribute("aria-pressed", String(state.logPaused));
      if (!state.logPaused) refreshLogs();
    });
  }

  wire();
  refreshState();
  refreshLogs();
  setInterval(refreshState, 2000);
  setInterval(refreshLogs, 3000);
})();
</script>
</body>
</html>
